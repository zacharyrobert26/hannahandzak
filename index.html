<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannah & Zak Travels</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            text-align: center;
        }
        h1 {
            color: #111;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1.1rem;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .photo-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .photo-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Hannah & Zak Travels</h1>
    <p>Welcome to our journey. Photos and stories coming soon.</p>

    <div class="gallery">
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Sample landscape">
            <p style="font-size: 0.9rem; margin-top: 10px;">On the road</p>
        </div>
    </div>

</body>
</html>
